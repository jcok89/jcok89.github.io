<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="179권의 책 제목과 저자, 분야를 익히는 Jake의 간격 반복 카드">
    <title>책 제목·저자·분야 | Jake의 Anki</title>
    <link rel="stylesheet" href="portal.css">
    <link rel="stylesheet" href="anki.css">
</head>
<body>
    <main class="page-shell study-shell">
        <nav class="study-nav" aria-label="페이지 이동">
            <a class="back-link" href="anki.html">← Jake의 Anki로 돌아가기</a>
            <button class="text-button" id="reset-progress" type="button">학습 기록 초기화</button>
        </nav>

        <header class="study-header">
            <div>
                <span class="eyebrow">READING LIST · 179</span>
                <h1>책과 저자</h1>
                <p>책 제목과 저자, 분야를 서로 연결해 떠올리며 나만의 독서 지도를 익혀 보세요.</p>
            </div>
            <div class="study-controls">
                <div class="mode-control">
                    <label for="study-mode">학습 방향</label>
                    <select id="study-mode">
                        <option value="title-to-author">제목 → 저자</option>
                        <option value="author-to-title">저자 → 책</option>
                        <option value="title-to-category">제목 → 분야</option>
                        <option value="mixed">전체 섞기</option>
                    </select>
                </div>
                <div class="mode-control">
                    <label for="category-filter">분야</label>
                    <select id="category-filter">
                        <option value="all">전체 분야</option>
                    </select>
                </div>
            </div>
        </header>

        <section class="study-status" aria-label="학습 현황">
            <div class="status-item"><span>오늘 남은 카드</span><strong id="remaining-count">0</strong></div>
            <div class="status-item"><span>학습한 카드</span><strong id="studied-count">0</strong></div>
            <div class="status-item"><span>선택한 카드</span><strong id="total-count">179</strong></div>
            <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
        </section>

        <section class="review-area" aria-live="polite">
            <article class="flashcard" id="flashcard">
                <div class="card-face card-front" id="card-front"></div>
                <div class="card-face card-back" id="card-back" hidden></div>
            </article>

            <div class="review-controls">
                <button class="show-answer" id="show-answer" type="button">답 보기 <kbd>Space</kbd></button>
                <div class="rating-buttons" id="rating-buttons" hidden>
                    <button class="rating rating-again" data-rating="again" type="button"><span>다시</span><small>1분</small><kbd>1</kbd></button>
                    <button class="rating rating-hard" data-rating="hard" type="button"><span>어려움</span><small>6시간</small><kbd>2</kbd></button>
                    <button class="rating rating-good" data-rating="good" type="button"><span>좋음</span><small>1일+</small><kbd>3</kbd></button>
                    <button class="rating rating-easy" data-rating="easy" type="button"><span>쉬움</span><small>4일+</small><kbd>4</kbd></button>
                </div>
            </div>

            <p class="keyboard-hint">키보드: <kbd>Space</kbd> 답 보기 · <kbd>1</kbd>–<kbd>4</kbd> 기억 상태 선택</p>
        </section>

        <section class="complete-panel" id="complete-panel" hidden>
            <span class="complete-icon" aria-hidden="true">✓</span>
            <h2>오늘의 복습을 마쳤습니다</h2>
            <p id="complete-message">기억 상태에 맞춰 다음 복습 시점을 저장했습니다.</p>
            <button class="secondary-button" id="review-all" type="button">선택한 카드 다시 보기</button>
        </section>

        <aside class="storage-note">학습 기록은 현재 브라우저에만 저장됩니다. 분야 필터를 바꿔도 같은 카드의 진도는 이어집니다.</aside>
    </main>

    <script src="anki-books-data.js"></script>
    <script src="anki-books.js"></script>
</body>
</html>
