<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="간격 반복 카드로 지식을 익히는 Jake의 개인 Anki 학습실">
    <title>Jake의 Anki | Jake의 개인 도구실</title>
    <link rel="stylesheet" href="portal.css">
    <link rel="stylesheet" href="anki.css">
</head>
<body>
    <main class="page-shell anki-hub">
        <a class="back-link" href="index.html">← 개인 도구실로 돌아가기</a>

        <header class="anki-hero">
            <span class="eyebrow">JAKE'S ANKI</span>
            <h1>기억할수록<br>선명해지는 것들</h1>
            <p>보고, 떠올리고, 답을 확인하세요. 기억 상태에 맞춰 다음 복습 시점을 저장합니다.</p>
        </header>

        <section class="deck-section" aria-labelledby="deck-list-title">
            <div class="section-heading">
                <div>
                    <span class="section-kicker">DECKS</span>
                    <h2 id="deck-list-title">나의 덱</h2>
                </div>
                <span class="deck-count">1개</span>
            </div>

            <a class="deck-card" href="anki-artworks.html">
                <div class="deck-visual" aria-hidden="true">
                    <span class="frame frame-one"></span>
                    <span class="frame frame-two"></span>
                    <span class="frame frame-three"></span>
                    <span class="deck-number">220</span>
                </div>
                <div class="deck-body">
                    <div class="deck-meta"><span>ART · BBC SELECTION</span><span class="status status-live">학습 가능</span></div>
                    <h3>BBC 선정 위대한 그림 220</h3>
                    <p>220점의 작품명과 작가를 양방향 카드로 익힙니다. 같은 작가의 여러 작품도 한눈에 연결해 보세요.</p>
                    <div class="deck-facts" aria-label="덱 정보">
                        <span><strong>220</strong> 작품</span>
                        <span><strong>2</strong> 학습 방향</span>
                        <span>기기에 진도 저장</span>
                    </div>
                    <span class="deck-action">덱 열기 <span aria-hidden="true">→</span></span>
                </div>
            </a>
        </section>

        <footer>짧게 떠올리고, 잊기 전에 다시 만납니다.</footer>
    </main>
</body>
</html>
